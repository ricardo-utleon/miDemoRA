<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>La Suzana de Blender</title>
<meta name="description" content="Experiencia AR - La Suzana de Blender">
<script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
<script crossorigin="anonymous" src="./external/xr/xr.js" data-preload-chunks="face, slam"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  video,#camerafeed,canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;background:transparent!important}
  canvas{z-index:1!important;background-color:transparent!important}
  video{z-index:0!important}
  #start-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:linear-gradient(180deg,#1a1a1a 0%,#000 100%);color:#fff;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #start-screen h1{font-size:24px;line-height:1.2}
  #start-screen p{font-size:15px;opacity:.8;max-width:340px;line-height:1.5}
  #start-ar{appearance:none;border:0;cursor:pointer;background:#fff;color:#000;font-size:18px;font-weight:700;padding:16px 32px;border-radius:999px;min-width:240px;touch-action:manipulation}
  #start-ar:active{transform:scale(.97)}
  #status{font-size:13px;min-height:20px;opacity:.85;white-space:pre-line;max-width:340px}
</style>
</head>
<body>
<div id="start-screen">
  <h1>La Suzana de Blender</h1>
  <p>Toca el botón para activar la cámara y ver la experiencia en AR.</p>
  <button id="start-ar" type="button">Iniciar AR</button>
  <div id="status">Listo para iniciar - toca el botón</div>
</div>
<script>
  var statusEl = document.getElementById('status');
  var btn = document.getElementById('start-ar');
  var bundleLoaded = false;
  function onStart(e){
    if(e) e.preventDefault();
    statusEl.textContent = 'Cargando AR...';
    btn.textContent = 'Cargando...';
    btn.disabled = true;
    setTimeout(function(){ document.getElementById('start-screen').style.display = 'none'; }, 300);
    if(bundleLoaded) return;
    bundleLoaded = true;
    var s = document.createElement('script');
    s.src = 'bundle.js';
    s.onload = function(){
      setInterval(function(){
        document.querySelectorAll('video').forEach(function(v){
          v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
          v.muted = true; v.autoplay = true;
          if(v.paused) v.play().catch(function(){});
        });
      }, 500);
    };
    document.body.appendChild(s);
  }
  btn.addEventListener('click', onStart);
  btn.addEventListener('touchend', function(e){ e.preventDefault(); onStart(e); });
  var ua = navigator.userAgent || '';
  if (/Instagram|FBAN|FBAV|Line|WhatsApp|Twitter/i.test(ua)) {
    statusEl.textContent = 'Estás en el navegador de Instagram / WhatsApp. Toca ... > Abrir en Safari para que funcione la cámara.';
  }
</script>
</body>
</html>
